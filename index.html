here<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>SBI Card - Play Store</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    background: #fff;
    margin: 0;
    padding: 24px 16px;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 700px;
  }

  /* ---------- App Header Section ---------- */
  .app-header {
    display: flex;
    gap: 20px;
    padding-bottom: 20px;
  }
  .app-icon {
    width: 110px;
    height: 110px;
    min-width: 110px;
    border-radius: 22px;
    border: 1px solid #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a3a8f, #0b1f4d);
    overflow: hidden;
  }
  .app-icon svg { width: 66px; height: 66px; }
  .app-info h1 {
    font-size: 32px;
    font-weight: 500;
    margin: 0 0 8px 0;
    color: #202124;
    line-height: 1.25;
  }
  .app-info .dev {
    color: #01875f;
    color: #1a73e8;
    font-size: 18px;
    margin: 0 0 16px 0;
  }
  .stats-row {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .stat { text-align: left; }
  .stat .top {
    font-size: 17px;
    font-weight: 500;
    color: #202124;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .stat .top .star { color: #202124; font-size: 15px; }
  .stat .bottom {
    font-size: 14px;
    color: #5f6368;
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
  }
  .divider-v { width: 1px; height: 32px; background: #e0e0e0; }
  .age-box {
    border: 1.5px solid #202124;
    border-radius: 4px;
    padding: 2px 8px;
    font-weight: 700;
    font-size: 14px;
  }

  /* ---------- Install Button ---------- */
  .install-btn {
    background: #01875f;
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 16px 56px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    margin: 14px 0 32px 0;
  }
  .install-btn:hover { background: #016a4a; }
  .install-btn.center-wrap { display: flex; justify-content: center; }

  hr.section-line {
    border: none;
    border-top: 1px solid #e0e0e0;
    margin: 0 0 24px 0;
  }

  /* ---------- Ratings Section ---------- */
  .ratings-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .ratings-title-row h2 {
    font-size: 25px;
    font-weight: 500;
    color: #202124;
    margin: 0;
  }
  .arrow-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f1f3f4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #202124;
  }
  .ratings-desc {
    font-size: 15px;
    color: #5f6368;
    line-height: 1.55;
    margin-bottom: 22px;
  }

  .rating-summary {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 22px;
  }
  .rating-number { font-size: 62px; font-weight: 400; color: #202124; }
  .rating-left .stars { color: #1a73e8; font-size: 15px; margin: 2px 0; }
  .rating-left .count { font-size: 13px; color: #5f6368; }

  .bars { flex: 1; }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .bar-row .num { font-size: 13px; color: #5f6368; width: 8px; }
  .bar-track {
    flex: 1;
    height: 8px;
    background: #e0e0e0;
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; background: #1a73e8; border-radius: 4px; }

  .tags-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .tag {
    border: 1px solid #dadce0;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    color: #202124;
    display: flex;
    align-items: center;
    gap: 6px;
  }

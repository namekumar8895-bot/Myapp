here<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBI Card</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f6f8;
  color:#171717;
}

.container{
  max-width:520px;
  margin:auto;
  background:#fff;
  min-height:100vh;
  padding-bottom:30px;
}

/* TOP */
.top{
  padding:22px 20px 18px;
}

.app-row{
  display:flex;
  align-items:center;
  gap:16px;
}

.logo{
  width:76px;
  height:76px;
  border-radius:17px;
  object-fit:cover;
}

.app-info{
  flex:1;
}

.app-info h1{
  font-size:24px;
  margin-bottom:6px;
}

.app-info p{
  color:#666;
  font-size:14px;
}

.unofficial{
  display:inline-block;
  margin-top:7px;
  padding:4px 8px;
  border-radius:5px;
  background:#eeeeee;
  color:#666;
  font-size:11px;
  font-weight:bold;
}

/* APP INFO */
.info{
  display:flex;
  justify-content:space-around;
  text-align:center;
  padding:15px 10px 20px;
  border-bottom:1px solid #eee;
}

.info div{
  font-size:13px;
  color:#666;
}

.info strong{
  display:block;
  color:#222;
  font-size:15px;
  margin-bottom:5px;
}

/* INSTALL BUTTON - ABOVE ABOUT */
.install-box{
  padding:15px 20px 5px;
}

.install{
  width:100%;
  height:48px;
  border:0;
  border-radius:25px;
  background:#1769e0;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.install:active{
  transform:scale(.98);
}

/* ABOUT */
.section{
  padding:20px;
}

.section h2{
  font-size:20px;
  margin-bottom:10px;
}

.about{
  color:#555;
  font-size:14px;
  line-height:1.6;
}

/* RATINGS */
.rating-section{
  margin:6px 16px 0;
  padding:11px;
  border:1px solid #e6e6e6;
  border-radius:10px;
  background:#fff;
}

.rating-section h2{
  font-size:15px;
  margin-bottom:9px;
}

.rating-main{
  display:flex;
  gap:11px;
  align-items:center;
}

.rating-number{
  width:58px;
  text-align:center;
}

.rating-number strong{
  display:block;
  font-size:25px;
}

.stars{
  color:#f5a623;
  font-size:10px;
  letter-spacing:.5px;
}

.rating-number small{
  display:block;
  color:#777;
  font-size:8px;
  margin-top:2px;
}

.bars{
  flex:1;
}

.bar-row{
  display:flex;
  align-items:center;
  gap:5px;
  height:10px;
}

.bar-row span{
  width:8px;
  font-size:8px;
  color:#555;
}

.bar{
  height:4px;
  background:#e2e2e2;
  border-radius:10px;
  flex:1;
  overflow:hidden;
}

.fill{
  height:100%;
  background:#f5a623;
  border-radius:10px;
}

/* REVIEWS */
.review{
  margin-top:9px;
  padding-top:8px;
  border-top:1px solid #eee;
}

.review-head{
  display:flex;
  align-items:center;
  gap:7px;
}

.avatar{
  width:25px;
  height:25px;
  border-radius:50%;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:bold;
}

.review-name{
  font-size:10px;
  font-weight:bold;
}

.review-date{
  font-size:8px;
  color:#888;
}

.review .stars{
  margin-top:2px;
  font-size:9px;
}

.review-text{
  margin:4px 0 0 32px;
  color:#555;
  font-size:9px;
  line-height:1.35;
}

/* DETAILS */
.details{
  margin:12px 16px 0;
  padding:13px;
  border-radius:10px;
  background:#f8f8f8;
}

.details h3{
  font-size:15px;
  margin-bottom:8px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid #e8e8e8;
  font-size:11px;
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-row span:last-child{
  color:#666;
}
</style>
</head>

<body>

<div class="container">

  <!-- TOP -->
  <div class="top">
    <div class="app-row">

      <img
        class="logo"
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/SBI-logo.svg/512px-SBI-logo.svg.png"
        alt="SBI Card Logo"
      >

      <div class="app-info">
        <h1>SBI Card</h1>
        <p>State Bank of India</p>
        <span class="unofficial">Unofficial</span>
      </div>

    </div>
  </div>

  <!-- APP INFO -->
  <div class="info">

    <div>
      <strong>4.2 ★</strong>
      Rating
    </div>

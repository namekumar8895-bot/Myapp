<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBI Card - Unofficial Demo</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#202124;
}

.page{
  width:100%;
  max-width:650px;
  margin:auto;
}

/* TOP APP AREA */
.header{
  display:flex;
  align-items:center;
  gap:14px;
  padding:20px 18px 12px;
}

.app-icon{
  width:72px;
  height:72px;
  min-width:72px;
  border-radius:17px;
  background:#fff;
  box-shadow:0 2px 8px #ccc;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.app-icon-text{
  font-size:19px;
  font-weight:bold;
  color:#0758b8;
}

.app-icon-text span{
  color:#16a9df;
}

.title{
  flex:1;
}

.title h1{
  margin:0 0 5px;
  font-size:22px;
  font-weight:600;
  line-height:1.2;
}

.title p{
  margin:3px 0;
  font-size:13px;
  color:#075fc0;
  line-height:1.3;
}

.downloads{
  color:#555 !important;
}

/* INFO */
.info-row{
  display:flex;
  justify-content:space-around;
  text-align:center;
  padding:13px 8px;
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
}

.info-item{
  flex:1;
  border-right:1px solid #ddd;
}

.info-item:last-child{
  border-right:0;
}

.big{
  font-size:25px;
  font-weight:bold;
}

.small{
  margin-top:5px;
  font-size:13px;
  color:#555;
}

.star{
  color:#1769d1;
}

/* UNOFFICIAL DEMO */
.demo{
  margin:12px 20px 5px;
  padding:5px;
  text-align:center;
  font-size:12px;
  color:#777;
}

/* INSTALL BUTTON */
.install-area{
  padding:10px 20px 22px;
  text-align:center;
}

.install-btn{
  display:block;
  width:100%;
  padding:13px;
  border-radius:25px;
  background:#1769d1;
  color:white;
  text-decoration:none;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 3px 8px rgba(0,0,0,.16);
}

.install-btn:active{
  transform:scale(.97);
}

/* RATINGS */
.reviews{
  border-top:1px solid #ddd;
  padding:20px;
}

.reviews h2{
  margin:0 0 18px;
  font-size:21px;
  font-weight:500;
}

.rating-number{
  font-size:50px;
  margin-bottom:3px;
}

.review-count{
  color:#555;
  font-size:14px;
}

.stars{
  color:#1769d1;
  font-size:21px;
  letter-spacing:2px;
}

.bars{
  margin-top:18px;
}

.bar-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0;
}

.bar{
  flex:1;
  height:10px;
  background:#dce3eb;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:#1769d1;
  border-radius:20px;
}

.five{width:78%;}
.four{width:15%;}
.three{width:5%;}
.two{width:5%;}
.one{width:5%;}

/* REVIEW CARD */
.review-card{
  margin-top:22px;
  padding-top:20px;
  border-top:1px solid #ddd;
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.username{
  font-size:16px;
  font-weight:bold;
}

.date{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.review-stars{
  color:#1769d1;
  font-size:20px;
  margin-top:14px;
}

.review-text{
  font-size:14px;
  line-height:1.5;
  color:#444;
  margin-top:10px;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:25px 15px;
  color:#777;
  font-size:11px;
}
</style>
</head>

<body>

<div class="page">

  <!-- APP HEADER -->

  <div class="header">

    <div class="app-icon">
      <div class="app-icon-text">
        SBI <span>Card</span>
      </div>
    </div>

    <div class="title">
      <h1>SBI Card: Manage<br>Credit Card</h1>

      <p>
        SBI Cards and Payment Services Limited
      </p>

      <p class="downloads">
        Unofficial Demo
      </p>
    </div>

  </div>


  <!-- APP INFORMATION -->

  <div class="info-row">

    <div class="info-item">
      <div class="big star">4.6 ★</div>
      <div class="small">1m reviews</div>
    </div>

    <div class="info-item">
      <div class="big">3+</div>
      <div class="small">Rated for 3+</div>
    </div>
